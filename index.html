      const getCellRelativeProgress = (subj, cls, editDateStr, editPid) => {
        if (subj.type !== 'auto' || !subj.units || subj.units.length === 0) return getClassProgress(subj, cls);
        const periodIds = ['p1','p2','p3','p4','p5','p6'];
        const prefix = cls || '';
        const esc = (str) => str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const pat = new RegExp(`^${esc(prefix)}${esc(subj.name)}（(.+) (\\d+)/(\\d+)）$`);
        const editPIdx = periodIds.indexOf(editPid);
        let last = null;
        for (const key of Object.keys(weeklyData)) {
          const ds = key.substring(0, 10);
          const pid = key.substring(11);
          const pIdx = periodIds.indexOf(pid);
          if (pIdx < 0) continue;
          if (editDateStr && (ds > editDateStr || (ds === editDateStr && editPIdx >= 0 && pIdx >= editPIdx))) continue;
          const cell = weeklyData[key];
          if (!cell?.subject || cell.useTemplate) continue;
          const m = cell.subject.match(pat);
          if (!m) continue;
          const ui = subj.units.findIndex(u => u.name === m[1]);
          if (ui < 0) continue;
          if (!last || ds > last.ds || (ds === last.ds && pIdx > last.pIdx)) last = { ds, pIdx, ui, h: parseInt(m[2]) };
        }
        if (!last) return getClassProgress(subj, cls);
        let ui = last.ui, h = last.h + 1;
        if (h > (subj.units[ui]?.hours || 0)) { ui++; h = 1; }
        return { currentUnitIdx: ui, currentHour: h };
      };
      const saveExtraData = (ny,nd,nv) => { setYearlyData(ny); setDocuments(nd); setVacations(nv); saveToFirestore('extra',{yearlyData:ny,documents:nd,vacations:nv}); saveToLocal({yearlyData:ny,documents:nd,vacations:nv}); };
      const saveQuickMemos = (nm) => { setQuickMemos(nm); saveToFirestore('quickMemos',{memos:nm}); saveToLocal({quickMemos:nm}); };

      const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(''), 3000); };
      const handleAuthSubmit = async (e) => { 
        e.preventDefault(); setAuthError(''); 
        try { 
          if(isRegistering) await window.__firebaseCreateUser(window.__firebaseAuth, authEmail, authPassword); 
          else await window.__firebaseSignIn(window.__firebaseAuth, authEmail, authPassword); 
          
          if (rememberMe) {
            localStorage.setItem('ep_mail', authEmail);
            localStorage.setItem('ep_pass', btoa(authPassword));
          } else {
            localStorage.removeItem('ep_mail');
            localStorage.removeItem('ep_pass');
          }
        } catch(err) { setAuthError(err.message); } 
      };
      
      const handleLogout = async () => {
        try {
          localStorage.removeItem('ep_mail');
          localStorage.removeItem('ep_pass');
          await window.__firebaseSignOut(window.__firebaseAuth);
          showToast('ログアウトしました');
        } catch (e) {
          showToast('ログアウトに失敗しました');
        }
      };

      const changeWeek = (offset) => { const nd = new Date(currentWeekStart); nd.setDate(nd.getDate()+offset*7); setCurrentWeekStart(nd); };
      
      const copyFromPreviousWeek = () => {
        const prevMonday = new Date(currentWeekStart); prevMonday.setDate(prevMonday.getDate() - 7);
        let copied = 0; const nextData = { ...weeklyData }; const nextSettings = { ...weeklySettings };
        for (let i = 0; i < 7; i++) {
          const prevDate = new Date(prevMonday); prevDate.setDate(prevDate.getDate() + i);
          const curDate = new Date(currentWeekStart); curDate.setDate(curDate.getDate() + i);
          const prevStr = formatDate(prevDate); const curStr = formatDate(curDate);
          if (weeklySettings[prevStr]) nextSettings[curStr] = { ...weeklySettings[prevStr] };
          ROWS.forEach(row => {
            const prevKey = `${prevStr}-${row.id}`; const curKey = `${curStr}-${row.id}`;
            if (weeklyData[prevKey]) { nextData[curKey] = { ...weeklyData[prevKey], useTemplate: false }; copied++; }
          });
        }
        setWeeklyData(nextData); setWeeklySettings(nextSettings); saveAll(baseTemplate, templateSettings, nextData, nextSettings);
        showToast(`📋 前週から${copied}件コピーしました`);
      };

      const exportData = () => {
        const data = {
          baseTemplate, templateSettings, weeklyData, weeklySettings,
          todos, yearlyData, documents, vacations, notesData, syllabusData, quickMemos
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `EduPlanner_Backup_${formatDate(new Date())}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('バックアップをダウンロードしました');
      };

      const importData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (window.confirm('現在のデータが上書きされます。よろしいですか？')) {
              if (data.baseTemplate) setBaseTemplate(data.baseTemplate);
              if (data.templateSettings) setTemplateSettings(data.templateSettings);
              if (data.weeklyData) setWeeklyData(data.weeklyData);
              if (data.weeklySettings) setWeeklySettings(data.weeklySettings);
              if (data.todos) setTodos(data.todos);
              if (data.yearlyData) setYearlyData(data.yearlyData);
              if (data.documents) setDocuments(data.documents);
              if (data.vacations) setVacations(data.vacations);
              if (data.notesData) setNotesData(data.notesData);
              if (data.syllabusData) setSyllabusData(data.syllabusData);
              if (data.quickMemos) setQuickMemos(data.quickMemos);
              
              saveToFirestore('template', { baseTemplate: data.baseTemplate, templateSettings: data.templateSettings });
              saveWeeklyDocs(data.weeklyData, data.weeklySettings);
              saveToFirestore('todos', { todos: data.todos });
              saveToFirestore('notes', { notes: data.notesData });
              saveToFirestore('syllabus', { syllabus: data.syllabusData });
              saveToFirestore('extra', { yearlyData: data.yearlyData, documents: data.documents, vacations: data.vacations });
              saveToFirestore('quickMemos', { memos: data.quickMemos });
              saveToLocal(data);
              cloudDataLoaded.current = true;
              setDataLoadStatus('loaded');

              showToast('データを復元しました');
            }
          } catch(err) {
            showToast('ファイルの読み込みに失敗しました');
          }
        };
        reader.readAsText(file);
      };

      // 年度が変わるときの準備をまとめて行う。過去の年度の週案・記録には手を触れない
      const runYearSetup = () => {
        const y = Number(yearSetupTarget);
        if (!Number.isFinite(y)) return;
        if (!window.confirm(`${y}年度の準備を実行します。よろしいですか？`)) return;
        const done = [];

        if (yearSetupOpts.backup) { exportData(); done.push('データをダウンロードしました'); }

        if (yearSetupOpts.template) {
          const nt = setYearMap(baseTemplate, y, { ...resolveYearMap(baseTemplate, y, {}) });
          const ns = setYearMap(templateSettings, y, { ...resolveYearMap(templateSettings, y, DEFAULT_TEMPLATE_SETTINGS) });
          saveAll(nt, ns, weeklyData, weeklySettings);
          done.push(`${y}年度の基本時間割・日課を切り出しました（内容は前年度のまま）`);
        }

        if (yearSetupOpts.todos) {
          const rest = todos.filter(t => !t.completed);
          if (rest.length !== todos.length) { saveTodos(rest); done.push(`完了済みのTODOを${todos.length - rest.length}件削除しました`); }
          else done.push('削除する完了済みTODOはありませんでした');
        }

        let nextYearly = yearlyData;
        if (yearSetupOpts.events) {
          const prev = yearlyData[y - 1] || yearlyData[String(y - 1)];
          if (prev) { nextYearly = { ...yearlyData, [y]: { ...prev, ...(yearlyData[y] || {}) } }; done.push(`${y - 1}年度の年間行事を${y}年度にコピーしました（曜日のずれは年間タブで直してください）`); }
          else done.push(`${y - 1}年度の年間行事が見つかりませんでした`);
        }

        const addVacs = yearSetupVacs
          .filter(v => v.start && v.end)
          .map((v, i) => ({ id: `vac-${y}-${i}-${Date.now()}`, name: v.name, start: v.start, end: v.end }));
        const nextVacations = addVacs.length ? [...vacations, ...addVacs] : vacations;
        if (addVacs.length) done.push(`長期休業を${addVacs.length}件追加しました`);

        if (nextYearly !== yearlyData || nextVacations !== vacations) saveExtraData(nextYearly, documents, nextVacations);

        if (yearSetupOpts.syllabus) {
          const reset = syllabusData.map(sub => ({ ...sub, currentUnitIdx: 0, currentHour: 1, classProgress: {} }));
          saveSyllabus(reset);
          done.push(`単元計画${reset.length}件の進度をリセットしました`);
        }

        setYearSetupResult({ year: y, done });
        setYearSetupVacs(yearSetupVacs.map(v => ({ ...v, start: '', end: '' })));
        showToast(`🌸 ${y}年度の準備が完了しました`);
      };

      const isYearlyHoliday = (ds, yData) => isHolidayEventText(getYearlyEventText(yData, ds));

      const getDaySetting = (ds, di) => {
        if (weeklySettings[ds]) return weeklySettings[ds];
        const vac = getVacationDaySetting(ds, di, vacations);
        if (vac) return vac;
        const [y,m,d] = ds.split('-').map(Number);
        if (getHolidayName(y,m,d)) return {type:'holiday'};
        if (isYearlyHoliday(ds, yearlyData)) return {type:'holiday'};
        const inferred = getInferredDaySetting(yearlyData, ds);
        if (inferred) return inferred;
        const daySettings = activeTab === 'template' ? activeTemplateSettings : getTemplateSettingsFor(ds);
        return daySettings[di] || DEFAULT_TEMPLATE_SETTINGS[di];
      };
      const syncEventToYearly = (dateStr, nextSubject) => {
        if (!dateStr) return;
        const [y,m,d] = dateStr.split('-').map(Number);
        const sy = m < 4 ? y - 1 : y;
        const md = `${m}-${d}`;
        const prevWeekly = weeklyData[`${dateStr}-event`]?.subject || '';
        const currentYearlyLines = (yearlyData[sy]?.[md] || '').split('\n').filter(s => s.trim());
        const prevLines = prevWeekly.split('\n').map(s => s.trim()).filter(Boolean);
        const nextLines = (nextSubject || '').split('\n').map(s => s.trim()).filter(Boolean);
        const keptLines = currentYearlyLines.filter(line => !prevLines.includes(line.trim()));
        const mergedLines = [...keptLines];
        nextLines.forEach(line => { if (!mergedLines.includes(line)) mergedLines.push(line); });
        const nextYear = { ...(yearlyData[sy] || {}) };
        // 空でもキーを残す（初期データとのマージで削除済み行事が復活するのを防ぐ）
        nextYear[md] = mergedLines.join('\n');
        saveExtraData({ ...yearlyData, [sy]: nextYear }, documents, vacations);
      };
      const getMergedYearlyEventText = (dateStr) => {
        const yearlyText = getYearlyEventText(yearlyData, dateStr);
        const weeklyText = weeklyData[`${dateStr}-event`]?.subject || '';
        const yearlyLines = yearlyText.split('\n').map(s => s.trim()).filter(Boolean);
        const extraLines = weeklyText.split('\n').map(s => s.trim()).filter(Boolean).filter(line => !yearlyLines.includes(line));
        if (yearlyLines.length === 0) return extraLines.join('\n');
        if (extraLines.length === 0) return yearlyText;
        return yearlyText.replace(/\n+$/, '') + '\n' + extraLines.join('\n');
      };
      
      const getCellData = (ds, pid, di) => { 
        const wk=`${ds}-${pid}`; 
        const tk=`${di}-${pid}`; 
        let base = (activeTab === 'template' ? activeTemplate : getTemplateFor(ds))[tk] || { subject:'', memo:'' }; 
        if (activeTab === 'template') return base; 

        const set = getDaySetting(ds, di);
        if (isNoClassType(set.type) && pid !== 'event' && pid !== 'diary') {
          base = { subject:'', memo:'' };
        }

        let result = base;
        const ov = weeklyData[wk]; 
        if (ov && !ov.useTemplate) { 
          result = { ...ov };
        }

        if (pid === 'event' && activeTab !== 'template') {
          const [y,m,d] = ds.split('-').map(Number);
          const sy = m < 4 ? y - 1 : y;
          const ye = yearlyData[sy]?.[`${m}-${d}`];
          if (ye && ye.trim() !== '') {
            const yeLines = ye.trim().split('\n').filter(s => s.trim());
            const weeklyLines = result.subject ? result.subject.trim().split('\n').filter(s => s.trim()) : [];
            const newYeLines = yeLines.filter(yl => !weeklyLines.some(wl => wl.trim() === yl.trim()));
            const allLines = [...newYeLines, ...weeklyLines];
            result = { ...result, subject: allLines.join('\n') };
          }
        } 

        return result; 
      };

      // 時数の集計対象：単元計画に登録した教科（クラス接頭辞つきで展開）＋ 総合・学活・道徳
      const getCountTargets = () => {
        const targets = [];
        syllabusData.forEach(s => {
          if (s.classes && s.classes.length > 0) s.classes.forEach(cls => { if (!targets.includes(cls + s.name)) targets.push(cls + s.name); });
          else if (!targets.includes(s.name)) targets.push(s.name);
        });
        ['総合', '学活', '道徳'].forEach(n => { if (!targets.includes(n)) targets.push(n); });
        return targets;
      };
      // コマの教科表示（例: 22社会（歴史4（3） 1/7））がどの集計対象に当たるか判定（先頭一致・長い名前を優先）
      const matchCountTarget = (raw, targetsByLength) => {
        const line = raw.split('\n')[0].trim();
        for (const t of targetsByLength) {
          if (line === t || line.startsWith(t + '（') || line.startsWith(t + '(') || line.startsWith(t + ' ') || line.startsWith(t + '　')) return t;
        }
        return null;
      };

      // 累計時数サマリー：年度開始(4/1)から今日までのp1〜p6を集計対象の教科ごとにカウント
      // 週案の入力値と基本時間割（テンプレート）を合わせた表示上のコマが対象。休日日課の日は除外
      const getCumulativeSubjectSummary = () => {
        const targets = getCountTargets();
        const targetsByLength = [...targets].sort((a, b) => b.length - a.length);
        const counts = {}; targets.forEach(t => { counts[t] = 0; });
        const periodIds = ['p1','p2','p3','p4','p5','p6'];
        const today = getJSTDate(); today.setHours(0, 0, 0, 0);
        const sy = (today.getMonth() + 1) < 4 ? today.getFullYear() - 1 : today.getFullYear();
        const cur = new Date(sy, 3, 1);
        let total = 0;
        while (cur <= today) {
          const ds = formatDate(cur);
          let di = cur.getDay() - 1; if (di === -1) di = 6;
          if (!isNoClassType(getDaySetting(ds, di).type)) {
            for (const pid of periodIds) {
              const raw = (getCellData(ds, pid, di).subject || '').trim();
              if (raw) {
                const t = matchCountTarget(raw, targetsByLength);
                if (t) { counts[t]++; total++; }
              }
            }
          }
          cur.setDate(cur.getDate() + 1);
        }
        return { list: targets.map(t => [t, counts[t]]), total, startLabel: `${sy}/4/1` };
      };

      // 基本時間割（テンプレート）の週あたりコマ数を集計対象の教科ごとにカウント（休日日課の曜日は除外）
      const getTemplateSubjectSummary = () => {
        const targets = getCountTargets();
        const targetsByLength = [...targets].sort((a, b) => b.length - a.length);
        const counts = {}; targets.forEach(t => { counts[t] = 0; });
        const periodIds = ['p1','p2','p3','p4','p5','p6'];
        let total = 0;
        for (let di = 0; di < 7; di++) {
          const set = activeTemplateSettings[di] || DEFAULT_TEMPLATE_SETTINGS[di];
          if (set && isNoClassType(set.type)) continue;
          for (const pid of periodIds) {
            const raw = (activeTemplate[`${di}-${pid}`]?.subject || '').trim();
            if (!raw) continue;
            const t = matchCountTarget(raw, targetsByLength);
            if (t) { counts[t]++; total++; }
          }
        }
        return { list: targets.map(t => [t, counts[t]]), total };
      };

      // ===== 予定表の取り込み（AIチャットで読み取ったデータの貼り付け） =====
      const closeAiImport = () => { setShowAiImport(false); setAiImportText(''); setAiImportResult(null); setAiImportError(''); };

      // ClaudeなどのAIチャットに写真と一緒に貼り付けてもらうプロンプト
      const buildAiPrompt = () => {
        const today = formatDate(getJSTDate());
        return `この画像は日本の学校の月行事予定表または週報（週予定・時間割）です。記載内容を読み取り、次のJSON形式だけを出力してください（説明文は不要です）。

{"events":[{"date":"YYYY-MM-DD","title":"行事名"}],"timetable":[{"date":"YYYY-MM-DD","period":1,"subject":"教科名"}]}

- events: 日付が特定できる行事・予定（テスト、保護者会、式典など）
- timetable: 日付と時限（1〜6）が特定できる授業の教科名。なければ空配列 []
- 今日は${today}です。年の記載がない場合は学校の年度内で最も自然な年に補完してください
- 判読できない項目や日付が特定できない項目は含めないでください`;
      };

      const copyAiPrompt = async () => {
        const text = buildAiPrompt();
        try {
          await navigator.clipboard.writeText(text);
          showToast('📋 プロンプトをコピーしました。AIチャットに写真と一緒に貼り付けてください');
        } catch (e) {
          try {
            const ta = document.createElement('textarea');
            ta.value = text; document.body.appendChild(ta); ta.select();
            document.execCommand('copy'); document.body.removeChild(ta);
            showToast('📋 プロンプトをコピーしました。AIチャットに写真と一緒に貼り付けてください');
          } catch (e2) { showToast('⚠️ コピーできませんでした。手動で選択してコピーしてください'); }
        }
      };

      // AIチャットの返答テキストからJSONを取り出して検証
      const parseAiImportText = () => {
        setAiImportError('');
        try {
          let s = aiImportText.trim();
          if (!s) throw new Error('AIチャットの返答を貼り付けてください');
          const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/);
          if (fence) s = fence[1].trim();
          const start = s.indexOf('{');
          const end = s.lastIndexOf('}');
          if (start === -1 || end <= start) throw new Error('JSONデータが見つかりませんでした。AIの返答全体をそのまま貼り付けてください');
          let parsed;
          try { parsed = JSON.parse(s.slice(start, end + 1)); }
          catch (e) { throw new Error('データの形式を読み取れませんでした。AIに「JSON形式だけで出力して」と伝え直してください'); }
          const events = (Array.isArray(parsed.events) ? parsed.events : [])
            .filter(e => e && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && e.title && String(e.title).trim())
            .map(e => ({ date: e.date, title: String(e.title).trim(), checked: true }));
          const timetable = (Array.isArray(parsed.timetable) ? parsed.timetable : [])
            .filter(t => t && /^\d{4}-\d{2}-\d{2}$/.test(t.date) && Number(t.period) >= 1 && Number(t.period) <= 6 && t.subject && String(t.subject).trim())
            .map(t => ({ date: t.date, period: Number(t.period), subject: String(t.subject).trim(), checked: true }));
          if (events.length === 0 && timetable.length === 0) throw new Error('取り込める予定・時間割がデータに含まれていませんでした');
          setAiImportResult({ events, timetable });
        } catch (err) {
          setAiImportError(err.message || '読み取りに失敗しました');
        }
      };

      const applyAiImport = () => {
        if (!aiImportResult) return;
        const selEvents = aiImportResult.events.filter(e => e.checked);
        const selTT = aiImportResult.timetable.filter(t => t.checked);
        if (selEvents.length > 0) {
          const ny = JSON.parse(JSON.stringify(yearlyData));
          selEvents.forEach(ev => {
            const [y, m, d] = ev.date.split('-').map(Number);
            const sy = m < 4 ? y - 1 : y;
            if (!ny[sy]) ny[sy] = {};
            const key = `${m}-${d}`;
            const lines = (ny[sy][key] || '').split('\n').map(s => s.trim()).filter(Boolean);
            if (!lines.includes(ev.title)) lines.push(ev.title);
            ny[sy][key] = lines.join('\n');
          });
          saveExtraData(ny, documents, vacations);
        }
        let ttApplied = 0;
        if (selTT.length > 0) {
          const n = { ...weeklyData };
          selTT.forEach(t => {
            const wk = `${t.date}-p${t.period}`;
            const existing = n[wk];
            if (existing && !existing.useTemplate && existing.subject) return; // 手入力済みは上書きしない
            n[wk] = { subject: t.subject, memo: '', useTemplate: false };
            ttApplied++;
          });
          saveAll(baseTemplate, templateSettings, n, weeklySettings);
        }
        closeAiImport();
        const parts = [];
        if (selEvents.length > 0) parts.push(`行事${selEvents.length}件`);
        if (ttApplied > 0) parts.push(`授業${ttApplied}コマ`);
        showToast(parts.length > 0 ? `✅ ${parts.join('・')}を取り込みました` : '取り込む項目がありませんでした');
      };

      const getAvailablePid = (dateStr, dayIdx) => {
        const pids = ['p1','p2','p3','p4','p5','p6','morning','lunch'];
        for (let pid of pids) {
            const cd = getCellData(dateStr, pid, dayIdx);
            if (!cd.subject || cd.subject.trim() === '') return pid;
        }
        return 'p1';
      };
      
      const getPeriodTime = (setting, pid) => SCHEDULE_TIMES[setting.type]?.[pid];
      const handleSettingChange = (ds, di, ns) => { if(activeTab==='template'){ const n=setYearMap(templateSettings, templateSchoolYear, {...activeTemplateSettings,[di]:ns}); setTemplateSettings(n); saveAll(baseTemplate,n,weeklyData,weeklySettings); } else { const n={...weeklySettings,[ds]:ns}; setWeeklySettings(n); saveAll(baseTemplate,templateSettings,weeklyData,n); } };

          newMemos = [...savedWeekMemos, updatedMemo];
        } else {
          const isNew = !savedWeekMemos.find(m => m.id === updatedMemo.id);
          newMemos = isNew 
            ? [...savedWeekMemos, updatedMemo]
            : savedWeekMemos.map(m => m.id === updatedMemo.id ? updatedMemo : m);
        }

        const nd = { ...weeklyData, [weekMemoKey]: { memos: newMemos, useTemplate: false } };
        
        if (isOld && editingWeekMemo.originalKey) {
          nd[editingWeekMemo.originalKey] = { ...(nd[editingWeekMemo.originalKey] || {}), useTemplate: true, memo: '', subject: '', startTime: '', endTime: '' }; 
        }

        setWeeklyData(nd);
        saveAll(baseTemplate, templateSettings, nd, weeklySettings);
        setEditingWeekMemo(null);
        setShowWeekMemoPad(false);
        showToast('ノートを保存しました');
      };

      const deleteWeekMemo = (id, isOld, originalKey) => {
        const nd = { ...weeklyData };
        if (isOld) {
          nd[originalKey] = { ...(nd[originalKey] || {}), useTemplate: true, memo: '', subject: '', startTime: '', endTime: '' }; 
        } else {
          const newMemos = savedWeekMemos.filter(m => m.id !== id);
          nd[weekMemoKey] = { ...(nd[weekMemoKey] || {}), memos: newMemos, useTemplate: false };
        }

        showToast('ノートを削除しました（Undoで復元可）');
      };

      const clearHandwriting = () => { if(quickCanvasRef.current){ const ctx=quickCanvasRef.current.getContext('2d'); ctx.clearRect(0,0,quickCanvasRef.current.width,quickCanvasRef.current.height); } };

      const startDrawing = (e) => { 
        try {
          if (pencilOnly && e.pointerType !== 'pen' && e.pointerType !== 'mouse') return;
          if (!quickCanvasRef.current) return;
          
          isDrawingRef.current = true;
          
          const r = quickCanvasRef.current.getBoundingClientRect(); 
          const ctx = quickCanvasRef.current.getContext('2d'); 
          
          const x = (e.clientX - r.left) * (quickCanvasRef.current.width / (r.width || 1));
          const y = (e.clientY - r.top) * (quickCanvasRef.current.height / (r.height || 1));
          
          if (!isFinite(x) || !isFinite(y)) return;

          ctx.beginPath(); 
          ctx.moveTo(x, y); 
          lastPosRef.current = { x, y };
        } catch(err) { console.error("Canvas start error:", err); }
      };
      
      const draw = (e) => { 
        try {
          if (!isDrawingRef.current) return; 
          if (pencilOnly && e.pointerType !== 'pen' && e.pointerType !== 'mouse') return;
          if (!quickCanvasRef.current) return;
          
          const r = quickCanvasRef.current.getBoundingClientRect(); 
          const ctx = quickCanvasRef.current.getContext('2d'); 
          
          ctx.globalCompositeOperation = isEraser ? 'destination-out' : 'source-over';
          ctx.strokeStyle = isEraser ? 'rgba(0,0,0,1)' : (penColor || '#0f172a');
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          
          let pressure = e.pressure !== undefined ? e.pressure : 0.5;
          if (pressure === 0) pressure = 0.5;
          
          let tilt = 0;
          if (e.tiltX !== undefined && e.tiltY !== undefined) {
            tilt = Math.sqrt(e.tiltX * e.tiltX + e.tiltY * e.tiltY);
          }
          
          let baseSize = isEraser ? 30 : 3;
          let finalSize = baseSize * (pressure * 2);
          if (!isEraser && tilt > 45) { 
            finalSize += (tilt - 45) * 0.2;
            ctx.strokeStyle = (penColor || '#0f172a') + '80'; 
          }
          ctx.lineWidth = finalSize || baseSize;
          
          const x = (e.clientX - r.left) * (quickCanvasRef.current.width / (r.width || 1));
          const y = (e.clientY - r.top) * (quickCanvasRef.current.height / (r.height || 1));
          
          if (!isFinite(x) || !isFinite(y)) return;

          ctx.beginPath();
          ctx.moveTo(lastPosRef.current.x, lastPosRef.current.y);
          ctx.lineTo(x, y); 
          ctx.stroke(); 
          
          lastPosRef.current = { x, y };
        } catch (err) {
          console.error("Canvas draw error:", err);
        }
      };

          const tCtx = tempCanvas.getContext('2d');
          tCtx.fillStyle = '#ffffff'; 
          tCtx.fillRect(0,0,tempCanvas.width,tempCanvas.height);
          tCtx.drawImage(canvas, 0, 0);
          const du = tempCanvas.toDataURL('image/png');

                        let topPct, heightPct;
                        if (e.start) {
                          const [sh,sm] = e.start.split(':').map(Number);
                          const startMin = sh*60+sm;
                          let endMin = startMin + 60;
                          if (e.end) { const [eh,em]=e.end.split(':').map(Number); endMin=eh*60+em; }
                          topPct = Math.max(0, Math.min(88, ((startMin - RANGE_START) / TOTAL_RANGE) * 100));
                          heightPct = Math.max(4, Math.min(((endMin - startMin) / TOTAL_RANGE) * 100, 100 - topPct));
                        } else {
                          const isMorningPid = MORNING_PIDS.includes(e.pid);
                          if (isMorningPid) {
                            const slotH = Math.min(18, Math.max(8, (noonPct - 10) / Math.max(1, morningUntimedCount)));

                          } else {

                            afternoonUntimedCounter++;
                          }
                        }

                          </div>
                        )
                      })}
                    </div>
                  );
                })}

            </div>

          {showHandwritingPad && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur z-[130] flex flex-col p-4 sm:p-8">
              <div className="flex-1 bg-white dark:bg-slate-800 rounded-[2rem] flex flex-col overflow-hidden shadow-2xl relative">
                <div className="p-4 border-b dark:border-slate-700 bg-slate-50 dark:bg-slate-900 flex justify-between items-center shrink-0">
                  <h2 className="font-black text-lg dark:text-slate-200">✏️ 手書き入力</h2>
                  <div className="flex gap-2">
                    <button onClick={clearHandwriting} className="px-4 py-2 bg-white dark:bg-slate-800 dark:text-slate-200 rounded-lg border dark:border-slate-600 font-bold text-sm shadow-sm active:scale-95">全消去</button>
                    <button onClick={() => setShowHandwritingPad(false)} className="px-4 py-2 bg-slate-100 dark:bg-slate-700 dark:text-slate-200 rounded-lg border dark:border-slate-600 font-bold text-sm shadow-sm active:scale-95">キャンセル</button>
                    <button onClick={saveHandwriting} className="px-6 py-2 bg-blue-600 text-white rounded-lg font-bold text-sm shadow-md active:scale-95">決定</button>
                  </div>
                </div>
                
                {/* ツールバー */}
                <div className="flex items-center justify-center gap-4 p-2 bg-slate-100 dark:bg-slate-800 border-b dark:border-slate-700 shrink-0">
                  <div className="flex gap-2 bg-white dark:bg-slate-900 p-1.5 rounded-xl shadow-sm border dark:border-slate-700">
                    {['#0f172a', '#ef4444', '#3b82f6', '#10b981', '#f59e0b'].map(color => (
                      <button key={color} onClick={() => { setPenColor(color); setIsEraser(false); }} className={`w-8 h-8 rounded-full border-2 transition-transform ${!isEraser && penColor === color ? 'scale-110 border-blue-400 shadow-md' : 'border-transparent hover:scale-105'}`} style={{ backgroundColor: color === '#0f172a' && theme === 'dark' ? '#f8fafc' : color }} title="ペン色"></button>
                    ))}
                  </div>
                  <div className="w-px h-8 bg-slate-300 dark:bg-slate-700"></div>
                  <button onClick={() => setIsEraser(true)} className={`px-4 py-1.5 rounded-xl font-bold text-sm flex items-center gap-2 transition-all ${isEraser ? 'bg-blue-100 text-blue-700 border-blue-300 border shadow-sm' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800'}`}>
                    <span>▱</span> 消しゴム
                  </button>
                </div>

                <div className="flex-1 bg-slate-200 dark:bg-slate-900 p-2 sm:p-4 flex items-center justify-center touch-none relative">
                  {pencilOnly && <div className="absolute top-4 left-4 bg-black/50 text-white px-3 py-1 rounded-full text-xs font-bold pointer-events-none backdrop-blur-sm z-10">Apple Pencil のみ有効</div>}
                  <canvas ref={quickCanvasRef} width={1200} height={900} className="bg-white rounded-xl shadow-lg border dark:border-slate-600 max-w-full max-h-full object-contain touch-none cursor-crosshair" onPointerDown={startDrawing} onPointerMove={draw} onPointerUp={endDrawing} onPointerCancel={endDrawing} onPointerOut={endDrawing} style={{touchAction:'none'}}/>
                </div>
              </div>
            </div>
          )}

          {/* 🌸 新年度セットアップ */}
          {showYearSetup && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur z-[140] flex items-center justify-center p-4" onClick={() => setShowYearSetup(false)}>
              <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl w-full max-w-lg max-h-[90dvh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                <div className="p-5 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center sticky top-0 bg-white dark:bg-slate-800 z-10">
                  <h2 className="font-black text-lg text-slate-800 dark:text-slate-100">🌸 新年度セットアップ</h2>
                  <button onClick={() => setShowYearSetup(false)} className="text-slate-400 hover:text-slate-600 font-black text-xl px-2">×</button>
                </div>

                {yearSetupResult ? (
                  <div className="p-5 space-y-4">
                    <div className="text-sm font-black text-slate-800 dark:text-slate-100">{yearSetupResult.year}年度の準備が完了しました</div>
                    <ul className="space-y-2">
                      {yearSetupResult.done.map((line, i) => (
                        <li key={i} className="text-xs font-bold text-slate-700 dark:text-slate-200 bg-slate-50 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-700 rounded-xl p-3 leading-relaxed">✅ {line}</li>
                      ))}
                    </ul>
                    <p className="text-[11px] font-bold text-slate-500 dark:text-slate-400 leading-relaxed">
                      このあと、基本タブで{yearSetupResult.year}年度の時間割を組み替え、年間タブで行事予定を入れてください。前年度までの週案はそのまま残っています。
                    </p>
                    <button onClick={() => setShowYearSetup(false)} className="w-full py-3 bg-blue-600 text-white rounded-xl font-black text-sm shadow-md hover:bg-blue-700">閉じる</button>
                  </div>
                ) : (
                  <>
                    <div className="p-5 space-y-4">
                      <div className="flex items-center gap-3">
                        <span className="text-sm font-black text-slate-700 dark:text-slate-200">対象年度</span>
                        <div className="flex items-center bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl">
                          <button onClick={() => setYearSetupTarget(y => Number(y) - 1)} className="px-3 py-1.5 font-black text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-l-xl">◀</button>
                          <span className="px-3 text-sm font-black text-slate-800 dark:text-slate-100">{yearSetupTarget}年度</span>
                          <button onClick={() => setYearSetupTarget(y => Number(y) + 1)} className="px-3 py-1.5 font-black text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-r-xl">▶</button>
                        </div>
                      </div>
                      <p className="text-[11px] font-bold text-slate-500 dark:text-slate-400 leading-relaxed">
                        {yearSetupTarget}年4月〜{Number(yearSetupTarget) + 1}年3月の準備をします。前年度までの週案・記録は書き換わりません。
                      </p>

                      {[
                        ['backup', '今のデータをJSONでダウンロードして保存する'],
                        ['template', `基本時間割と曜日ごとの日課を${yearSetupTarget}年度用に切り出す（中身は前年度のまま。あとから組み替えても前年度に影響しません）`],
                        ['events', `${Number(yearSetupTarget) - 1}年度の年間行事を月日そのままコピーする（曜日のずれは後で直す）`],
                        ['syllabus', '単元計画の進度をリセットする（教科・単元・クラスはそのまま残ります）'],
                        ['todos', '完了済みのTODOを削除する'],
                      ].map(([key, label]) => (
                        <label key={key} className="flex items-start gap-3 bg-slate-50 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-700 rounded-xl p-3 cursor-pointer">
                          <input type="checkbox" checked={yearSetupOpts[key]} onChange={e => setYearSetupOpts(o => ({ ...o, [key]: e.target.checked }))} className="mt-0.5 w-4 h-4 accent-blue-600 shrink-0" />
                          <span className="text-xs font-bold text-slate-700 dark:text-slate-200 leading-relaxed">{label}</span>
                        </label>
                      ))}

                      <div className="border border-slate-200 dark:border-slate-700 rounded-xl p-3 space-y-2">
                        <div className="text-xs font-black text-slate-700 dark:text-slate-200">長期休業（日付を入れた分だけ追加します）</div>
                        {yearSetupVacs.map((v, i) => (
                          <div key={v.name} className="flex items-center gap-1.5">
                            <span className="text-[11px] font-black text-slate-600 dark:text-slate-300 w-16 shrink-0">{v.name}</span>
                            <input type="date" value={v.start} onChange={e => setYearSetupVacs(list => list.map((x, ix) => ix === i ? { ...x, start: e.target.value } : x))} className="flex-1 min-w-0 text-[11px] font-bold border border-slate-300 dark:border-slate-600 rounded-lg p-1.5 bg-white dark:bg-slate-900 dark:text-slate-100 outline-none focus:border-blue-400" />
                            <span className="text-[11px] font-bold text-slate-400">〜</span>
                            <input type="date" value={v.end} onChange={e => setYearSetupVacs(list => list.map((x, ix) => ix === i ? { ...x, end: e.target.value } : x))} className="flex-1 min-w-0 text-[11px] font-bold border border-slate-300 dark:border-slate-600 rounded-lg p-1.5 bg-white dark:bg-slate-900 dark:text-slate-100 outline-none focus:border-blue-400" />
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="p-5 border-t border-slate-200 dark:border-slate-700 flex gap-2 sticky bottom-0 bg-white dark:bg-slate-800">
                      <button onClick={() => setShowYearSetup(false)} className="flex-1 py-3 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl font-black text-sm">やめる</button>
                      <button onClick={runYearSetup} className="flex-[2] py-3 bg-blue-600 text-white rounded-xl font-black text-sm shadow-md hover:bg-blue-700">この内容で実行する</button>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // 描画中に例外が出ると React は画面を空にする。真っ白のまま残さず、内容を出す
    class AppErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error }; }
      componentDidCatch(error, info) { this.info = info; }
      copyDetail() {
        const text = [
          'EduPlanner 表示エラー',
          `日時: ${new Date().toLocaleString('ja-JP')}`,
          `ページ: ${location.href}`,
          `端末情報: ${navigator.userAgent}`,
          '',
          String(this.state.error && this.state.error.stack || this.state.error),
          String((this.info && this.info.componentStack) || '')
        ].join('\n');
        try { navigator.clipboard.writeText(text); } catch (e) {}
      }
      render() {
        if (!this.state.error) return this.props.children;
        return (
          <div style={{display:'flex',height:'100dvh',alignItems:'center',justifyContent:'center',padding:'1.5rem',fontFamily:'sans-serif',background:'#f8fafc'}}>
            <div style={{maxWidth:'460px',width:'100%'}}>
              <div style={{fontSize:'15px',fontWeight:700,color:'#b91c1c',marginBottom:'6px'}}>画面の表示でエラーが起きました</div>
              <div style={{fontSize:'12px',fontWeight:700,color:'#64748b',marginBottom:'12px'}}>データは保存されています。この内容をそのまま送ってください。</div>
              <pre style={{margin:0,whiteSpace:'pre-wrap',wordBreak:'break-all',fontSize:'11px',lineHeight:1.6,color:'#475569',background:'#fff',border:'1px solid #e2e8f0',borderRadius:'12px',padding:'12px',maxHeight:'40vh',overflow:'auto'}}>
                {String(this.state.error && this.state.error.stack || this.state.error)}
              </pre>
              <div style={{display:'flex',gap:'8px',marginTop:'12px'}}>
                <button onClick={()=>location.reload()} style={{padding:'9px 18px',background:'#2563eb',color:'#fff',border:'none',borderRadius:'10px',fontWeight:700,fontSize:'13px',cursor:'pointer'}}>再読み込み</button>
                <button onClick={()=>this.copyDetail()} style={{padding:'9px 18px',background:'#fff',color:'#334155',border:'1px solid #cbd5e1',borderRadius:'10px',fontWeight:700,fontSize:'13px',cursor:'pointer'}}>内容をコピー</button>
              </div>
            </div>
          </div>
        );
      }
    }

    // 起動画面を消してよいのは、最初の描画が実際に終わったときだけ
    const AppRoot = () => {
      useEffect(() => { window.__appMounted = true; }, []);
      return <AppErrorBoundary><TeacherPlanner /></AppErrorBoundary>;
    };
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppRoot />);
  </script>
</body>
</html>
